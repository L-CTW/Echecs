<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07060c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nocturne" />
    <title>Nocturne — Échecs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="vignette"></div>
    <div class="flash" id="flash"></div>

    <header class="top hud">
      <div class="brand">Nocturne</div>
      <div class="status" id="status" aria-live="polite">
        <p id="statusMain">La nef s’ouvre</p>
        <p id="statusSub"></p>
      </div>
      <div class="top-actions">
        <button type="button" id="soundBtn" class="icon" aria-label="Son" aria-pressed="true">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 10h4l5-4v12l-5-4H3zm13.5 2a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12z"/></svg>
        </button>
        <button type="button" id="menuBtn" class="icon" aria-label="Menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 7h16v1.6H4zm0 4.2h16v1.6H4zm0 4.2h16V17H4z"/></svg>
        </button>
      </div>
    </header>

    <p class="hint hud" id="hint">Touchez une pièce, puis sa case.</p>

    <footer class="bottom hud">
      <div class="inner">
        <button type="button" class="cam on" data-view="nef" id="camNef">Nef</button>
        <button type="button" class="cam" data-view="choeur" id="camChoeur">Chœur</button>
        <button type="button" class="cam" data-view="zenith" id="camZenith">Zénith</button>
        <button type="button" class="cam" data-view="transept" id="camTransept">Transept</button>
        <button type="button" class="cam" data-view="crypte" id="camCrypte">Crypte</button>
      </div>
    </footer>

    <div class="backdrop" id="backdrop" hidden></div>
    <aside class="menu" id="menu" hidden>
      <div class="menu-head">
        <h2>La partie</h2>
        <button type="button" id="menuClose" class="icon" aria-label="Fermer">×</button>
      </div>
      <button type="button" id="newGame" class="wide">Nouvelle partie</button>
      <div class="row">
        <button type="button" id="sideW" class="wide on">Marbres</button>
        <button type="button" id="sideB" class="wide">Obsidienne</button>
      </div>
      <p class="label">Adversaire</p>
      <div class="row three">
        <button type="button" id="lvInitie" class="wide">Initié</button>
        <button type="button" id="lvChanoine" class="wide on">Chanoine</button>
        <button type="button" id="lvEveque" class="wide">Évêque</button>
      </div>
      <div class="row">
        <button type="button" id="undo" class="wide" disabled>Revenir</button>
        <button type="button" id="resign" class="wide">Abandonner</button>
      </div>
      <p class="label">Coups</p>
      <div class="moves" id="moves"></div>
    </aside>

    <div class="splash" id="splash">
      <div class="splash-card">
        <p class="eyebrow">Cathédrale · minuit</p>
        <h1>Nocturne</h1>
        <p class="motto">Lux in tenebris</p>
        <p class="lede">Marbre contre obsidienne.<br />Une partie sous les vitraux.</p>
        <button type="button" id="enter" disabled>Entrer dans la nef</button>
        <p class="boot" id="boot">Les torches s’allument…</p>
      </div>
    </div>

    <div class="modal" id="promo" hidden>
      <div class="modal-card">
        <p class="eyebrow">Promotion</p>
        <h2>Choisir la pièce</h2>
        <div class="promo-grid">
          <button type="button" data-promo="q">Dame</button>
          <button type="button" data-promo="r">Tour</button>
          <button type="button" data-promo="b">Fou</button>
          <button type="button" data-promo="n">Cavalier</button>
        </div>
        <button type="button" id="promoCancel" class="texty">Annuler</button>
      </div>
    </div>

    <div class="modal" id="end" hidden>
      <div class="modal-card end-card">
        <p class="eyebrow" id="endKicker"></p>
        <h2 id="endTitle"></h2>
        <p class="lede" id="endDetail"></p>
        <button type="button" id="endAgain">Rejouer</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
